<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="robots" content="noindex">
<title>Sign in · {{SITE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/site.css">
</head>
<body data-next="{{NEXT}}" data-google="{{GOOGLE}}" data-dev="{{DEV}}" data-error="{{ERROR}}">
<header class="sh"><div class="cx"><a class="logo" href="/"><i></i>{{SITE}}</a><span class="sp"></span><a class="btn" href="/">Back to site</a></div></header>
<main class="narrow">
  <div class="box">
    <h1>Sign in</h1>
    <p class="muted">Sign in to open the board. New here? Signing in creates your account.</p>
    <p class="err" id="err" hidden></p>
    <a class="btn primary lg block" id="google" href="/auth/google?next={{NEXT}}" hidden>Continue with Google</a>
    <p class="muted" id="nogoogle" hidden>Google sign-in is not set up on this server yet.</p>
    <div class="dev" id="dev" hidden>
      <p>Test sign-in (DEV_LOGIN is on). Turn this off before going live.</p>
      <form id="devform">
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
        <button class="btn block" type="submit">Sign in for testing</button>
      </form>
    </div>
    <p class="muted" style="font-size:13px;margin:18px 0 0">By continuing you agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy policy</a>.</p>
  </div>
</main>
<script>
(() => {
  const b = document.body.dataset, $ = (s) => document.querySelector(s);
  if (b.error) { $('#err').hidden = false; $('#err').textContent = b.error; }
  $('#google').hidden = !b.google; $('#nogoogle').hidden = !!b.google || !!b.dev; $('#dev').hidden = !b.dev;
  const csrf = (document.cookie.match(/(?:^|; )zb_csrf=([^;]*)/) || [])[1] || '';
  $('#devform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const r = await fetch('/auth/dev', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRF': decodeURIComponent(csrf) }, body: JSON.stringify({ email: $('#email').value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) location.assign(b.next || '/app'); else { $('#err').hidden = false; $('#err').textContent = j.error || 'Could not sign in'; }
  });
})();
</script>
</body>
</html>
